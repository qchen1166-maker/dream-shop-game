<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#b8d8d1">
<title>理想生活 · 可玩原型 v0.1</title>
<style>
:root{--ink:#24343a;--cream:#fff8e9;--mint:#b8d8d1;--coral:#f29c83;--gold:#f5cf75}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b8d8d1;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);touch-action:none}
button{font:inherit;border:0;cursor:pointer}
#game{position:relative;width:100%;height:100dvh;overflow:hidden;background:linear-gradient(#bde4e2 0%,#d8eee0 47%,#9dbfa2 48%,#719b80 100%);isolation:isolate}
.sky{position:absolute;inset:0 0 47% 0;background:linear-gradient(180deg,#b7e0e3,#e0f0df);overflow:hidden}
.sun{position:absolute;right:11%;top:9%;width:62px;height:62px;border-radius:50%;background:#ffe8a3;box-shadow:0 0 0 13px #ffe8a333,0 0 40px #ffe8a366}
.cloud{position:absolute;width:94px;height:27px;background:#fff8e8;border-radius:30px;opacity:.8;filter:drop-shadow(0 5px 0 #c4e0d9)}
.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%;bottom:8px}
.cloud:before{width:38px;height:38px;left:14px}.cloud:after{width:28px;height:28px;left:43px}
.c1{left:8%;top:18%;transform:scale(.8)}.c2{left:53%;top:31%;transform:scale(.62)}
.hills{position:absolute;bottom:-4px;width:100%;height:40%;background:#9dc7a3;clip-path:polygon(0 47%,12% 28%,22% 48%,39% 12%,55% 43%,71% 20%,86% 46%,100% 18%,100% 100%,0 100%)}
.world{position:absolute;inset:0;transform-origin:50% 60%;will-change:transform}
.ground{position:absolute;left:-100%;top:43%;width:300%;height:100%;background:linear-gradient(180deg,#b5d2a5,#9dc391 55%,#7ea980);transform:perspective(700px) rotateX(8deg)}
.lawn{position:absolute;top:46%;left:-10%;width:120%;height:80%;background:#a7cd96;clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
.path{position:absolute;left:50%;top:42%;width:43%;height:100%;transform:translateX(-50%) perspective(500px) rotateX(10deg);background:repeating-linear-gradient(0deg,#e9d7b6 0 72px,#e3cda9 73px 76px);clip-path:polygon(39% 0,61% 0,100% 100%,0 100%);box-shadow:inset 10px 0 #d0bc9b66,inset -10px 0 #d0bc9b66}
.path:after{content:"";position:absolute;left:48%;height:100%;width:4px;background:#fff3d566}
.house{position:absolute;width:175px;height:135px;top:33%;filter:drop-shadow(0 12px 0 #537d6855)}
.house .body{position:absolute;bottom:0;left:14px;width:145px;height:91px;background:#fff1d8;border:3px solid #e5bd91;border-radius:7px 7px 0 0}
.house .roof{position:absolute;top:0;left:0;width:175px;height:74px;background:#d98169;clip-path:polygon(50% 0,100% 68%,90% 76%,50% 25%,10% 76%,0 68%)}
.house .door{position:absolute;bottom:0;left:75px;width:31px;height:54px;background:#7b9e9a;border:3px solid #f8dfb7;border-radius:12px 12px 0 0}
.house .window{position:absolute;bottom:38px;width:28px;height:27px;background:#a6d9d9;border:4px solid #fff9e9;border-radius:4px}
.house .w1{left:30px}.house .w2{right:30px}
.h1{left:7%;top:31%;transform:scale(.86)}.h2{right:5%;top:35%;transform:scale(.76)}
.cafe{position:absolute;top:47%;left:4%;width:135px;height:78px;background:#fff2d5;border:3px solid #d6b58e;border-radius:8px;box-shadow:0 10px 0 #61896a55}
.cafe:before{content:"";position:absolute;top:-28px;left:-8px;width:145px;height:34px;background:#e99179;clip-path:polygon(0 0,100% 0,91% 100%,9% 100%)}
.cafe-sign{position:absolute;top:-21px;left:28px;font-size:12px;font-weight:900;color:white;letter-spacing:2px}
.cafe-window{position:absolute;left:15px;top:15px;width:42px;height:39px;background:#9ed8d9;border:4px solid white}
.cafe-door{position:absolute;right:17px;bottom:0;width:30px;height:47px;background:#c08c65;border:3px solid #fff1d5;border-radius:10px 10px 0 0}
.tree{position:absolute;width:66px;height:105px}
.tree:before{content:"";position:absolute;bottom:0;left:27px;width:14px;height:48px;background:#a96f4e;border-radius:6px}
.tree:after{content:"";position:absolute;top:0;left:0;width:66px;height:70px;background:#5caa83;border-radius:48% 52% 45% 50%;box-shadow:inset -8px -6px #458f70;border:3px solid #e0e8b5}
.t1{left:20%;top:49%;transform:scale(.9)}.t2{right:17%;top:48%;transform:scale(1.05)}.t3{left:74%;top:69%;transform:scale(.7)}
.bench{position:absolute;top:69%;right:8%;width:88px;height:28px;background:#c88e5b;border-radius:5px;box-shadow:0 9px 0 #805b47}
.bench:before,.bench:after{content:"";position:absolute;top:22px;width:8px;height:20px;background:#805b47}.bench:before{left:13px}.bench:after{right:13px}
.flower{position:absolute;top:77%;left:17%;font-size:24px}
.character{position:absolute;width:44px;height:77px;transform:translate(-50%,-50%);z-index:5;filter:drop-shadow(0 5px 2px #315b4733);pointer-events:none}
.char-shadow{position:absolute;bottom:0;left:4px;width:38px;height:11px;border-radius:50%;background:#4d715b55}
.char-body{position:absolute;bottom:9px;left:8px;width:28px;height:38px;border-radius:12px 12px 8px 8px;background:var(--shirt,#ef9d83);border:2px solid #fff2d9}
.char-head{position:absolute;top:3px;left:10px;width:25px;height:27px;border-radius:45% 45% 43% 43%;background:#f3c9a6;border:2px solid #fff0d9;z-index:2}
.char-hair{position:absolute;top:0;left:8px;width:29px;height:17px;border-radius:15px 15px 7px 7px;background:var(--hair,#59483f);z-index:3}
.char-eye{position:absolute;top:14px;left:17px;width:3px;height:3px;border-radius:50%;background:#4a4b42;z-index:4;box-shadow:9px 0 #4a4b42}
.char-legs{position:absolute;bottom:0;left:12px;width:8px;height:18px;background:#526c7c;border-radius:4px;box-shadow:12px 0 #526c7c}
.npc{pointer-events:auto;cursor:pointer}
.npc .char-body{background:var(--shirt,#f1b16e)}
.npc-name{position:absolute;top:-20px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff8e9eF;border:1px solid #fff;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:800;box-shadow:0 3px 7px #4d715b22}
#player{z-index:10;transition:filter .1s}
.hud{position:absolute;z-index:20;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.brand{background:#fff8e9ed;border:1px solid #fff;border-radius:17px;padding:10px 13px;box-shadow:0 5px 18px #476d6b22;max-width:55%}
.brand strong{display:block;font-size:16px;letter-spacing:1px}.brand small{display:block;font-size:10px;color:#65817a;margin-top:3px}
.stats{display:flex;flex-direction:column;gap:5px;background:#fff8e9ed;border:1px solid #fff;border-radius:15px;padding:8px 10px;min-width:112px;box-shadow:0 5px 18px #476d6b22}
.stat{display:grid;grid-template-columns:34px 1fr;gap:5px;align-items:center;font-size:10px;font-weight:800}
.bar{height:7px;background:#dbe4d7;border-radius:9px;overflow:hidden}.fill{height:100%;width:70%;background:#eaa17d;border-radius:9px;transition:width .2s}.fill.mood{background:#efb84d}.fill.energy{background:#7fbda6}
.hint{position:absolute;z-index:18;top:calc(env(safe-area-inset-top) + 115px);left:50%;transform:translateX(-50%);white-space:nowrap;background:#294b43c9;color:white;border-radius:20px;padding:8px 13px;font-size:12px;box-shadow:0 5px 15px #294b4330;pointer-events:none}
.controls{position:absolute;z-index:30;bottom:calc(env(safe-area-inset-bottom) + 20px);left:18px;right:18px;display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none}
.joy{position:relative;width:118px;height:118px;border-radius:50%;background:#fff8e966;border:2px solid #fff9;box-shadow:0 8px 22px #315c4d22;pointer-events:auto;touch-action:none}
.joy:before{content:"";position:absolute;inset:23px;border:1px dashed #779a8a88;border-radius:50%}
.knob{position:absolute;width:47px;height:47px;left:33px;top:33px;border-radius:50%;background:#fff8e9;border:2px solid #d8e5d5;box-shadow:0 4px 10px #365c4a30;display:grid;place-items:center;color:#638578;font-size:18px;pointer-events:none}
.actions{display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:auto}
.action-row{display:flex;gap:9px}
.pill{border:1px solid #fff;background:#fff8e9ed;color:#36564c;padding:12px 14px;border-radius:18px;font-size:12px;font-weight:900;box-shadow:0 5px 16px #315c4d22;min-width:75px}
.pill.primary{background:#ef9b7f;color:white;border-color:#ffcfb8;min-width:94px}
.pill:active{transform:translateY(1px)}
.interact{position:absolute;z-index:25;left:50%;bottom:calc(env(safe-area-inset-bottom) + 158px);transform:translateX(-50%);background:#fff8e9;color:#36564c;border:2px solid white;border-radius:20px;padding:10px 18px;font-weight:900;font-size:13px;box-shadow:0 6px 18px #315c4d30;display:none;white-space:nowrap}
.interact.show{display:block}
.panel-bg{position:absolute;inset:0;background:#243c38a6;z-index:50;display:none;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(env(safe-area-inset-bottom) + 12px)}
.panel-bg.show{display:flex}
.dialog{width:min(100%,500px);background:#fff8e9;border-radius:26px;padding:20px;box-shadow:0 15px 60px #193c3766;max-height:76dvh;overflow:auto;border:2px solid #fff}
.dialog-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.portrait{width:54px;height:54px;border-radius:18px;background:#d5e9d6;display:grid;place-items:center;font-size:29px}
.dialog h2{margin:0;font-size:20px}.sub{font-size:12px;color:#769086;margin-top:4px}
.dialog p{font-size:14px;line-height:1.7;margin:12px 0;color:#405b51}
.choices{display:flex;flex-direction:column;gap:8px}.choice{background:white;border:1px solid #e3dfc9;padding:13px 14px;border-radius:15px;text-align:left;color:#35564b;font-size:13px;font-weight:800;line-height:1.45}.choice:active{background:#e6f3e6}
.close{float:right;background:#e7eee2;border-radius:50%;width:30px;height:30px;font-weight:900;color:#56766a}
.toast{position:absolute;z-index:60;top:45%;left:50%;transform:translate(-50%,-50%);background:#294b43eF;color:white;padding:12px 18px;border-radius:18px;font-weight:800;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.maplabel{position:absolute;z-index:12;top:48%;left:50%;transform:translateX(-50%);color:#638a6c;font-size:10px;letter-spacing:4px;font-weight:900;opacity:.8;pointer-events:none}
.footer-note{font-size:10px;color:#7c9486;text-align:center;margin-top:12px}
@media(min-width:700px){#game{max-width:900px;margin:auto;border-left:5px solid #fff5;border-right:5px solid #fff5}.hud{left:22px;right:22px}.controls{left:28px;right:28px}}
</style>
</head>
<body>
<div id="game">
 <div class="sky"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="hills"></div></div>
 <div class="world" id="world">
  <div class="ground"></div><div class="lawn"></div><div class="path"></div>
  <div class="house h1"><div class="roof"></div><div class="body"></div><div class="window w1"></div><div class="window w2"></div><div class="door"></div></div>
  <div class="house h2"><div class="roof"></div><div class="body"></div><div class="window w1"></div><div class="window w2"></div><div class="door"></div></div>
  <div class="cafe"><div class="cafe-sign">MINT CAFE</div><div class="cafe-window"></div><div class="cafe-door"></div></div>
  <div class="tree t1"></div><div class="tree t2"></div><div class="tree t3"></div><div class="bench"></div><div class="flower">🌼 🌷</div>
  <div class="maplabel">MINT STREET · 薄荷街</div>
  <div class="character npc" id="npc-lin" data-npc="lin" style="left:34%;top:62%;--shirt:#f1a08b;--hair:#63493c"><div class="char-shadow"></div><div class="char-head"></div><div class="char-hair"></div><div class="char-eye"></div><div class="char-body"></div><div class="char-legs"></div><div class="npc-name">林夏</div></div>
  <div class="character npc" id="npc-zhou" data-npc="zhou" style="left:69%;top:72%;--shirt:#83b8a5;--hair:#493f3a"><div class="char-shadow"></div><div class="char-head"></div><div class="char-hair"></div><div class="char-eye"></div><div class="char-body"></div><div class="char-legs"></div><div class="npc-name">周野</div></div>
  <div class="character npc" id="npc-mia" data-npc="mia" style="left:18%;top:76%;--shirt:#e4bd68;--hair:#8a6048"><div class="char-shadow"></div><div class="char-head"></div><div class="char-hair"></div><div class="char-eye"></div><div class="char-body"></div><div class="char-legs"></div><div class="npc-name">米娅</div></div>
  <div class="character" id="player" style="left:50%;top:72%;--shirt:#7b9ed1;--hair:#4b403a"><div class="char-shadow"></div><div class="char-head"></div><div class="char-hair"></div><div class="char-eye"></div><div class="char-body"></div><div class="char-legs"></div></div>
 </div>
 <div class="hud">
  <div class="brand"><strong>理想生活 <span style="font-size:10px;color:#d8896e">v0.1</span></strong><small>薄荷街 · 一个新的开始</small></div>
  <div class="stats">
   <div class="stat"><span>⚡ 精力</span><div class="bar"><div id="energyBar" class="fill energy"></div></div></div>
   <div class="stat"><span>☀ 心情</span><div class="bar"><div id="moodBar" class="fill mood"></div></div></div>
   <div class="stat"><span>🪙 金币 <b id="coins">120</b></span><span style="text-align:right;color:#8b9d81">新手存款</span></div>
  </div>
 </div>
 <div class="hint" id="hint">拖动左下摇杆移动 · 靠近角色可聊天</div>
 <div class="controls">
  <div class="joy" id="joy"><div class="knob" id="knob">✦</div></div>
  <div class="actions">
   <div class="action-row"><button class="pill" id="homeBtn">⌂ 回家</button><button class="pill" id="saveBtn">存档</button></div>
   <button class="pill primary" id="talkBtn">💬 互动</button>
  </div>
 </div>
 <button class="interact" id="nearBtn">和附近的人聊聊</button>
 <div class="panel-bg" id="panelBg"><div class="dialog" id="dialog"></div></div>
 <div class="toast" id="toast"></div>
</div>
<script>
(()=> {
 const $=id=>document.getElementById(id);
 const world=$('world'), player=$('player'), joy=$('joy'), knob=$('knob');
 const state={x:50,y:72,energy:82,mood:68,coins:120,relationships:{lin:0,zhou:0,mia:0},lastNpc:null};
 const npcs={
  lin:{name:'林夏',emoji:'🌷',role:'花店店员',shirt:'#f1a08b',lines:['今天的风很舒服，你也出来散步吗？','我刚给花店换了新花，整条街都变得明亮了。'],choices:[
   {text:'认真听她介绍今天的新花',reply:'“你愿意听我讲这些小事，我很开心。”林夏笑了起来。',rel:2,mood:4},
   {text:'邀请她一起去薄荷咖啡馆',reply:'“好呀！我正好想喝一杯拿铁。”她欣然答应。',rel:3,mood:5,coins:-12},
   {text:'分享一个今天遇到的小趣事',reply:'她听完笑出了声，你们之间的距离近了一点。',rel:2,mood:6}
  ]},
  zhou:{name:'周野',emoji:'☕',role:'自由摄影师',lines:['我在等光线变柔一点，想拍下这条街的傍晚。','有时候慢一点，反而能看到平时忽略的东西。'],choices:[
   {text:'请教他怎么拍出好看的街景',reply:'周野给你分享了几个构图技巧，还顺手拍了张街景。',rel:2,mood:3},
   {text:'约他周末一起探索城市',reply:'“听起来不错，我知道几个很少有人去的地方。”',rel:3,mood:5},
   {text:'夸他的相机很专业',reply:'他笑着讲起自己的第一台相机，话匣子打开了。',rel:1,mood:2}
  ]},
  mia:{name:'米娅',emoji:'🎨',role:'插画师',lines:['你好！我在给街角画一张小插画。','我觉得每个人的生活都像一本还没画完的画册。'],choices:[
   {text:'蹲下来看看她的画',reply:'米娅把画本转给你看，里面有这条街的每个小角落。',rel:3,mood:5},
   {text:'问她附近还有什么值得探索',reply:'“沿着小路走到底有一座小花园，特别安静。”',rel:2,mood:3},
   {text:'邀请她一起喝杯热可可',reply:'“听起来超棒！我画完这一笔就来。”',rel:2,mood:5,coins:-8}
  ]}
 };
 let joyActive=false, joyId=null, joyRect=null, vx=0,vy=0,lastTime=0,toastTimer=null;
 function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
 function render(){
  player.style.left=state.x+'%';player.style.top=state.y+'%';
  // A gentle third-person-style follow camera: scenery shifts opposite to the player.
  const dx=(50-state.x)*.55, dy=(70-state.y)*.42;
  world.style.transform=`translate(${dx}%,${dy}%)`;
  $('energyBar').style.width=state.energy+'%';$('moodBar').style.width=state.mood+'%';$('coins').textContent=state.coins;
  let near=null,dist=999;
  Object.keys(npcs).forEach(k=>{const el=$('npc-'+k);const x=parseFloat(el.style.left),y=parseFloat(el.style.top);const d=Math.hypot((x-state.x)*1.1,y-state.y);if(d<dist){dist=d;near=k}});
  state.lastNpc=dist<12?near:null;
  $('nearBtn').classList.toggle('show',!!state.lastNpc);
  $('talkBtn').style.opacity=state.lastNpc?'1':'.78';
 }
 function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800)}
 function save(){try{localStorage.setItem('idealLifeSave',JSON.stringify({...state,savedAt:Date.now()}));toast('已保存生活进度 ✨')}catch(e){toast('当前浏览器无法保存，请勿关闭页面')}}
 function load(){try{const s=JSON.parse(localStorage.getItem('idealLifeSave'));if(s){Object.assign(state,s);toast('欢迎回来，生活继续！')}}catch(e){}render()}
 function openDialog(npcKey){
  const n=npcs[npcKey];if(!n)return;
  state.energy=clamp(state.energy-2,0,100);
  const rel=state.relationships[npcKey]||0;
  const greet=rel>=6?'见到你，'+n.name+'明显开心起来。':rel>=3?n.name+'认出你，主动向你打招呼。':n.lines[Math.floor(Math.random()*n.lines.length)];
  $('dialog').innerHTML=`<button class="close" id="closeDialog">×</button><div class="dialog-head"><div class="portrait">${n.emoji}</div><div><h2>${n.name}</h2><div class="sub">${n.role} · 关系亲密度 ${rel}</div></div></div><p>${greet}</p><div class="choices">${n.choices.map((c,i)=>`<button class="choice" data-choice="${i}">${c.text}</button>`).join('')}</div><div class="footer-note">选择会影响你们的关系、心情和金币</div>`;
  $('panelBg').classList.add('show');
  $('closeDialog').onclick=()=>{$('panelBg').classList.remove('show');render()};
  $('dialog').querySelectorAll('[data-choice]').forEach(btn=>btn.onclick=()=>{
   const c=n.choices[+btn.dataset.choice];state.relationships[npcKey]=clamp((state.relationships[npcKey]||0)+c.rel,0,100);state.mood=clamp(state.mood+c.mood,0,100);state.coins=Math.max(0,state.coins+(c.coins||0));
   $('dialog').innerHTML=`<button class="close" id="closeDialog">×</button><div class="dialog-head"><div class="portrait">${n.emoji}</div><div><h2>${n.name}</h2><div class="sub">关系亲密度 ${state.relationships[npcKey]} · 有了新的回忆</div></div></div><p>${c.reply}</p><button class="choice" id="continueBtn" style="width:100%;text-align:center;background:#e3f0df">继续探索这条街 →</button>`;
   $('closeDialog').onclick=$('continueBtn').onclick=()=>{$('panelBg').classList.remove('show');render()};
   render();
  });
  render();
 }
 function interact(){if(state.lastNpc)openDialog(state.lastNpc);else toast('再靠近一点附近的角色吧')}
 function move(dt){
  if(Math.abs(vx)+Math.abs(vy)<.05)return;
  if(state.energy<=0){vx=vy=0;toast('精力不足，回家休息一下吧');return}
  const speed=13*dt;state.x=clamp(state.x+vx*speed,7,93);state.y=clamp(state.y+vy*speed,49,88);
  state.energy=clamp(state.energy-dt*.5,0,100);render();
 }
 function loop(t){if(!lastTime)lastTime=t;const dt=Math.min((t-lastTime)/1000,.05);lastTime=t;move(dt);requestAnimationFrame(loop)}
 requestAnimationFrame(loop);
 function setJoy(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=35,l=Math.hypot(dx,dy);if(l>max){dx=dx/l*max;dy=dy/l*max}knob.style.transform=`translate(${dx}px,${dy}px)`;vx=dx/max;vy=dy/max}
 joy.addEventListener('pointerdown',e=>{joyActive=true;joyId=e.pointerId;joy.setPointerCapture(joyId);setJoy(e)});
 joy.addEventListener('pointermove',e=>{if(joyActive&&e.pointerId===joyId)setJoy(e)});
 function endJoy(){joyActive=false;joyId=null;vx=vy=0;knob.style.transform='translate(0,0)'}
 joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);
 $('talkBtn').onclick=interact;$('nearBtn').onclick=interact;$('saveBtn').onclick=save;
 $('homeBtn').onclick=()=>{state.x=50;state.y=72;state.energy=clamp(state.energy+25,0,100);state.mood=clamp(state.mood+8,0,100);render();toast('回到家附近，休息了一会儿 🏡')};
 Object.keys(npcs).forEach(k=>{$('npc-'+k).addEventListener('click',()=>{const d=Math.hypot((parseFloat($('npc-'+k).style.left)-state.x)*1.1,parseFloat($('npc-'+k).style.top)-state.y);if(d<18)openDialog(k);else toast('走近一点，再和'+npcs[k].name+'打招呼吧')})});
 $('panelBg').addEventListener('click',e=>{if(e.target===$('panelBg'))$('panelBg').classList.remove('show')});
 document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','w'].includes(k))vy=-1;if(['arrowdown','s'].includes(k))vy=1;if(['arrowleft','a'].includes(k))vx=-1;if(['arrowright','d'].includes(k))vx=1;if(k===' '||k==='e')interact()});
 document.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(['arrowup','w','arrowdown','s'].includes(k))vy=0;if(['arrowleft','a','arrowright','d'].includes(k))vx=0});
 load();render();
})();
</script>
