<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f7ead7"><title>梦想小店 v0.1</title>
<style>
:root{--ink:#3b3029;--muted:#87776a;--line:#ead9c4}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:linear-gradient(#f7ead7,#f2dfc6);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--ink)}button{font:inherit;border:0;touch-action:manipulation;cursor:pointer}.app{max-width:560px;margin:auto;padding:env(safe-area-inset-top) 14px calc(22px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;padding:16px 4px 12px}.brand small{font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:800}.brand h1{margin:4px 0;font-size:26px}.day,.stat,.panel{background:#fffaf2;border:1px solid var(--line);border-radius:17px;box-shadow:0 8px 24px #6b4b2b12}.day{padding:8px 12px;text-align:center}.day b,.day span{display:block}.day span{font-size:10px;color:var(--muted)}.stats{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;margin-bottom:12px}.stat{padding:11px 9px}.label{font-size:11px;color:var(--muted);margin-bottom:5px}.num{font-size:18px;font-weight:900;white-space:nowrap}.coin{color:#b87828}.scene{height:260px;position:relative;overflow:hidden;border-radius:25px;border:1px solid #dfc7a9;box-shadow:0 8px 24px #6b4b2b18;background:linear-gradient(#dcebe0 0 48%,#a7c59c 48% 67%,#e7d0ad 67%)}.sun{position:absolute;right:30px;top:20px;width:42px;height:42px;border-radius:50%;background:#ffd38a;box-shadow:0 0 0 10px #ffd38a25}.cloud{position:absolute;top:42px;left:25px;width:65px;height:18px;border-radius:30px;background:#fff8e9}.cloud:before{content:"";position:absolute;width:28px;height:28px;left:12px;top:-12px;border-radius:50%;background:inherit}.hill{position:absolute;left:-10%;right:-10%;height:85px;bottom:60px;border-radius:50% 50% 0 0;background:#c0d6ae}.ground{position:absolute;bottom:0;height:73px;width:100%;background:#e7d0ad;border-top:5px solid #b5c99c}.path{position:absolute;bottom:-25px;left:35%;width:34%;height:110px;background:#f8e6c7;transform:skew(-15deg);border-radius:35px 35px 0 0}.shop{position:absolute;bottom:49px;left:50%;transform:translateX(-50%);width:196px;height:126px;filter:drop-shadow(0 8px 4px #5b493020)}.roof{position:absolute;top:0;left:-9px;width:214px;height:42px;border:3px solid #9a5e42;border-radius:9px 9px 3px 3px;background:repeating-linear-gradient(90deg,#d98960 0 26px,#f0b27e 26px 52px)}.facade{position:absolute;top:35px;width:196px;height:91px;background:#fff1d7;border:3px solid #b87956;border-top:0;border-radius:0 0 7px 7px}.sign{position:absolute;top:7px;left:26px;width:138px;text-align:center;background:#fff9eb;border:2px solid #b87956;border-radius:7px;padding:4px;font-size:12px;font-weight:900;color:#6d4b37;letter-spacing:2px}.window{position:absolute;top:35px;left:12px;width:48px;height:40px;background:#b8d8d4;border:3px solid #9d6b50;border-radius:5px}.door{position:absolute;right:13px;top:61px;width:39px;height:62px;background:#a9c7bc;border:3px solid #9d6b50;border-radius:5px 5px 0 0}.awning{position:absolute;top:60px;left:69px;width:48px;height:19px;background:repeating-linear-gradient(90deg,#f6c27f 0 12px,#fff5df 12px 24px);border:2px solid #b87956;border-radius:4px}.flower{position:absolute;bottom:50px;font-size:25px}.left{left:8%}.right{right:8%}.customer{position:absolute;bottom:37px;font-size:30px;animation:bob 1.8s ease-in-out infinite;filter:drop-shadow(0 3px 2px #0002)}.c1{left:17%}.c2{left:73%;animation-delay:.5s}@keyframes bob{50%{transform:translateY(-4px)}}.tag{position:absolute;top:12px;left:12px;background:#fff8e8dd;border-radius:12px;padding:6px 9px;font-size:11px;font-weight:800}.open{left:auto;right:12px;background:#5d815d;color:white}.scene-bottom{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:11px;color:#6c5a45;font-weight:700}.panel{margin-top:13px;padding:15px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.head h2{font-size:16px;margin:0}.hint{font-size:11px;color:var(--muted)}.actions{display:flex;gap:9px}.primary,.secondary{flex:1;padding:14px 7px;border-radius:14px;font-size:13px;font-weight:900}.primary{background:linear-gradient(#f5ad6c,#e68b4b);color:white;box-shadow:0 4px 0 #c7763e}.secondary{background:#eef3e8;color:#4d714c;border:1px solid #d5e2ca}.primary:active,.secondary:active{transform:translateY(2px)}.goal{display:flex;justify-content:space-between;margin-top:13px;font-size:12px;color:var(--muted)}.progress{height:8px;background:#efe5d7;border-radius:10px;overflow:hidden;margin-top:8px}.progress div{height:100%;background:linear-gradient(90deg,#83a975,#c2d88c);width:0}.upgrades{display:grid;grid-template-columns:1fr 1fr;gap:9px}.upgrade{background:#fff8ee;border:1px solid var(--line);border-radius:15px;padding:11px;text-align:left;min-height:100px;display:flex;flex-direction:column;gap:5px;color:var(--ink)}.upgrade:disabled,button:disabled{opacity:.48}.upgrade-top{display:flex;align-items:center;gap:7px;font-weight:900;font-size:13px}.emoji{font-size:22px}.upgrade p{margin:0;color:var(--muted);font-size:11px;line-height:1.4}.cost{margin-top:auto;color:#b87828;font-size:12px;font-weight:900}.log{display:flex;flex-direction:column;gap:8px;font-size:12px;color:#746456;max-height:88px;overflow:hidden}.log-line{display:flex;gap:7px}.footer{text-align:center;color:#a28e7a;font-size:10px;padding:15px 4px 0;line-height:1.6}.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,15px);opacity:0;background:#3d342c;color:#fff8ed;border-radius:14px;padding:11px 16px;font-size:13px;transition:.2s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body><div class="app">
<header class="top"><div class="brand"><small>MY LITTLE BUSINESS</small><h1>梦想小店</h1></div><div class="day"><b id="day">第 1 天</b><span>慢慢经营，天天变好</span></div></header>
<section class="stats"><div class="stat"><div class="label">💰 当前金币</div><div class="num coin" id="coins">120</div></div><div class="stat"><div class="label">🧋 今日顾客</div><div class="num" id="customers">0</div></div><div class="stat"><div class="label">⭐ 店铺等级</div><div class="num" id="level">Lv.1</div></div></section>
<section class="scene"><div class="sun"></div><div class="cloud"></div><div class="hill"></div><div class="ground"></div><div class="path"></div><div class="shop"><div class="roof"></div><div class="facade"></div><div class="sign">梦想小店</div><div class="window"></div><div class="door"></div><div class="awning"></div></div><div class="flower left">🌷</div><div class="flower right">🪴</div><div class="customer c1" id="customer1">🧑🏻</div><div class="customer c2" id="customer2">👩🏽</div><div class="tag">☀️ 今日营业中</div><div class="tag open">● OPEN</div><div class="scene-bottom" id="sceneText">欢迎光临！今天也要好好经营哦。</div></section>
<section class="panel"><div class="head"><h2>🧾 店铺经营</h2><span class="hint">点击按钮开始赚钱</span></div><div class="actions"><button class="primary" id="serve">🛍️ 接待顾客 +18</button><button class="secondary" id="restock">📦 补货 -10</button></div><div class="goal"><span>新手目标：攒到 300 金币</span><strong id="goalText">120 / 300</strong></div><div class="progress"><div id="goalBar"></div></div></section>
<section class="panel"><div class="head"><h2>🛠️ 店铺升级</h2><span class="hint">升级后收益更高</span></div><div class="upgrades">
<button class="upgrade" id="upCounter"><div class="upgrade-top"><span class="emoji">🪵</span><span>升级收银台</span></div><p>每位顾客收入提高 6 金币。</p><div class="cost" id="counterCost">💰 80 金币 · Lv.0</div></button>
<button class="upgrade" id="upDecor"><div class="upgrade-top"><span class="emoji">🌼</span><span>店铺装饰</span></div><p>提升店铺等级，解锁更好的店面。</p><div class="cost" id="decorCost">💰 100 金币 · Lv.0</div></button>
<button class="upgrade" id="upProduct"><div class="upgrade-top"><span class="emoji">🧋</span><span>研发新品</span></div><p>推出招牌商品，让顾客消费更高。</p><div class="cost" id="productCost">💰 140 金币 · Lv.0</div></button>
<button class="upgrade" id="upAuto"><div class="upgrade-top"><span class="emoji">🧑‍🍳</span><span>招募店员</span></div><p>每次接待额外获得经营收益。</p><div class="cost" id="autoCost">💰 180 金币 · Lv.0</div></button>
</div></section>
<section class="panel"><div class="head"><h2>📒 经营日志</h2><span class="hint">每一步都算数</span></div><div class="log" id="log"><div class="log-line"><span>🌱</span><span>你接手了这家小店。接待顾客，积累第一桶金吧！</span></div></div></section>
<div class="footer">梦想小店 · 可玩原型 v0.1<br>试玩进度暂时保存在当前页面；刷新后可能重置。</div></div><div class="toast" id="toast"></div>
<script>
(()=>{const s={coins:120,customers:0,day:1,counter:0,decor:0,product:0,auto:0,stock:8,served:0};const $=id=>document.getElementById(id);const base={counter:80,decor:100,product:140,auto:180};let timer;
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.remove('show'),1600)}
function log(t,e='✨'){let d=document.createElement('div');d.className='log-line';let a=document.createElement('span'),b=document.createElement('span');a.textContent=e;b.textContent=t;d.append(a,b);$('log').prepend(d);while($('log').children.length>5)$('log').lastChild.remove()}
function cost(k){return Math.floor(base[k]*Math.pow(1.55,s[k]))}
function render(){$('coins').textContent=Math.floor(s.coins).toLocaleString('zh-CN');$('customers').textContent=s.customers;$('day').textContent='第 '+s.day+' 天';$('level').textContent='Lv.'+(1+s.decor+Math.floor(s.counter/2)+s.product);for(let k of Object.keys(base)){$(k+'Cost').textContent='💰 '+cost(k)+' 金币 · Lv.'+s[k];$('up'+k[0].toUpperCase()+k.slice(1)).disabled=s.coins<cost(k)}$('restock').disabled=s.coins<10;$('goalText').textContent=Math.min(300,Math.floor(s.coins))+' / 300';$('goalBar').style.width=Math.min(100,s.coins/3)+'%';if(s.coins>=300&&!$('sceneText').dataset.goal){$('sceneText').textContent='🎉 太棒了！你攒下第一桶金！';$('sceneText').dataset.goal='1';log('完成新手目标：金币达到 300！继续升级小店吧。','🏆');toast('新手目标完成！')}}
function serve(){if(s.stock<=0){toast('商品不足，请先补货！');return}s.stock--;s.customers++;s.served++;let income=18+s.counter*6+s.product*9+s.auto*3;s.coins+=income;$('sceneText').textContent=['顾客满意地离开了！','今天的生意真不错！','欢迎下次再来～','你的服务获得好评！'][Math.floor(Math.random()*4)];let faces=['🧑🏻','👩🏽','👨🏻','👩🏻‍🦰','🧔🏻','👩🏾'];$('customer1').textContent=faces[Math.floor(Math.random()*faces.length)];if(s.served%3===0){s.day++;log('忙碌的一天结束了，店铺继续成长。','🌙')}log('接待顾客成功，收入 +'+income+' 金币。','🛍️');render()}
function restock(){if(s.coins<10)return;s.coins-=10;s.stock+=5;log('补充了 5 份商品。','📦');toast('商品已补充！');render()}
function upgrade(k){let c=cost(k);if(s.coins<c)return;s.coins-=c;s[k]++;log(({counter:'收银台升级',decor:'店铺装饰',product:'研发新品',auto:'招募店员'})[k]+'成功，等级提升至 '+s[k]+'。','🎉');toast('升级成功！');render()}
$('serve').onclick=serve;$('restock').onclick=restock;for(let k of Object.keys(base))$('up'+k[0].toUpperCase()+k.slice(1)).onclick=()=>upgrade(k);render()})();
</script></body></html>
